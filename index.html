<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verity</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Welcome to my website</h1>
    <p>Verity is waiting in the corner...</p>

    <!-- Verity -->
    <button id="verityButton" class="verity-button">
        <img src="Verity.webp" alt="Verity">
    </button>

    <div id="verityChat" class="verity-chat">

        <div class="chat-header">
            <strong>Verity</strong>
            <button id="closeChat">×</button>
        </div>

        <div id="messages" class="messages">
            <div class="message verity-message">
                Hello! I'm Verity. How can I help you?
            </div>
        </div>

        <div class="chat-input">
            <input
                id="messageInput"
                type="text"
                placeholder="Message Verity..."
            >
            <button id="sendButton">➤</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
